version: '3.8'
services:
  order-service:
    build: ./order-service
    ports:
      - "8082:8082"
  product-service:
    build: ./product-service
    ports:
      - "8085:8085"
    depends_on:
      - order-service
      - payment-service
  payment-service:
    build: ./payment-service
    ports:
      - "8083:8083"